<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DomDom Inspector — Coverage</title>
    <style>
      /*
       * popup と同じトークン体系 (darkmode ファースト + prefers-color-scheme: light)。
       * 色値は popup/index.html と揃える — 2 面で違う色を使うと「別の拡張」に見える。
       * コントラストは src/overlayContrast.test.ts が色定数から毎回計算して検証する。
       */
      :root {
        color-scheme: dark light;
        --bg: #0f1116;
        --surface: #171a21;
        --surface-2: #1e2230;
        --border: #2a2f3d;
        --border-input: #6b7486;
        --text: #e8ebf1;
        --muted: #a3abbb;
        --accent-text: #8ec2ff;
        --accent-bg: #8ec2ff;
        --on-accent: #0b1220;
        --focus: #8ec2ff;
        --warn-text: #ffd43b;
        --warn-bg: rgba(255, 212, 59, 0.12);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --surface: #f5f7fa;
          --surface-2: #edf0f6;
          --border: #d7dde7;
          --border-input: #6a7386;
          --text: #1a1f2b;
          --muted: #525d75;
          --accent-text: #12569f;
          --accent-bg: #1668d4;
          --on-accent: #ffffff;
          --focus: #1668d4;
          --warn-text: #8a5a00;
          --warn-bg: rgba(255, 212, 59, 0.22);
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0 0 16px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.55;
        color: var(--text);
        background: var(--bg);
      }

      /*
       * ① 対象と鮮度 (sticky header)。パネルは popup と違い**開いたまま残る**ので、
       * 「この数字がどのページのいつのものか」を失うと popup 版より不誠実になる。
       * パネル化が新しく生む嘘なので最上段に固定する (設計 §4-1 ①)。
       */
      .head {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 10px 14px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }
      .head h1 { margin: 0 0 2px; font-size: 13px; letter-spacing: 0.01em; }
      .target {
        display: flex; flex-wrap: wrap; gap: 4px 8px;
        font-size: 11.5px; color: var(--muted);
        overflow-wrap: anywhere;
      }
      .target .sep { opacity: 0.5; }

      .body { padding: 12px 14px 0; }

      /* ② stale バナー。数字は消さず dim にして視覚的に切り離す (設計 §4-1 ②) */
      .banner {
        margin: 0 0 12px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        font-size: 11.5px;
        color: var(--text);
      }
      .banner.warn {
        border-color: var(--warn-text);
        background: var(--warn-bg);
        color: var(--warn-text);
      }
      .banner[hidden] { display: none; }

      /* stale のとき数字を dim にする。消さないのは前の値と見比べたいから */
      .result.stale { opacity: 0.45; }

      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 8px;
        background: var(--accent-bg);
        color: var(--on-accent);
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover:not(:disabled) { filter: brightness(1.08); }
      button:disabled {
        background: var(--surface-2); color: var(--muted);
        cursor: not-allowed; border: 1px solid var(--border); filter: none;
      }
      button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

      .block { margin-top: 14px; }
      .block h2 {
        margin: 0 0 6px; font-size: 11px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);
      }

      /* ③ 但し書き。数字より上に置き、影響先を印で示す */
      .notes { margin: 0; padding: 0; list-style: none; font-size: 11.5px; }
      .notes li {
        display: flex; gap: 6px; align-items: baseline;
        padding: 5px 8px; margin-bottom: 4px;
        border-radius: 6px; background: var(--surface); border: 1px solid var(--border);
      }
      .notes .tags { flex: none; display: inline-flex; gap: 3px; }
      .tag {
        font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em;
        padding: 0 4px; border-radius: 3px;
        background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
      }

      /* ④ 率の表。**率は必ず実数と同じ行に出る** */
      .rates { width: 100%; border-collapse: collapse; font-size: 12px; }
      .rates th {
        text-align: right; font-size: 10px; font-weight: 700; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.03em; padding: 0 0 4px;
      }
      .rates th:first-child { text-align: left; }
      .rates td { padding: 4px 0; border-top: 1px solid var(--border); vertical-align: baseline; }
      .rates td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .rates .pct { font-weight: 700; }
      .rates .counts { color: var(--muted); font-size: 11px; margin-left: 4px; }
      .rates .none { color: var(--muted); }
      /* 低サンプルは率の隣で言う (脚注にしない) */
      .rates .low { color: var(--warn-text); font-size: 10px; margin-left: 4px; }
      .legend { margin: 8px 0 0; font-size: 11px; color: var(--muted); }

      /* ⑤ 総合は小さく */
      .overall { margin: 12px 0 0; font-size: 11.5px; color: var(--muted); }
      .overall b { color: var(--text); font-variant-numeric: tabular-nums; }

      /* ⑥ 直すと効く値 */
      .offenders { margin: 0; padding: 0; list-style: none; font-size: 12px; }
      .offenders li {
        display: flex; gap: 8px; align-items: baseline; justify-content: space-between;
        padding: 5px 0; border-top: 1px solid var(--border);
      }
      .offenders .what { overflow-wrap: anywhere; }
      .offenders .what code {
        background: var(--surface-2); padding: 0 4px; border-radius: 3px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .offenders .count { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
      .offenders .near { display: block; color: var(--muted); font-size: 11px; }
      .empty { padding: 6px 0; font-size: 11.5px; color: var(--muted); }

      /* ⑦ 天井の表明 */
      .ceiling {
        margin: 14px 0 0; padding: 8px 10px;
        border-radius: 6px; border: 1px dashed var(--border);
        font-size: 11px; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header class="head">
      <h1 data-i18n="panelTitle">Token coverage</h1>
      <div class="target">
        <span id="targetName" data-i18n="panelNoTarget">No page selected</span>
        <span class="sep" id="targetSep" hidden>·</span>
        <span id="targetAge" hidden></span>
        <span class="sep" id="targetSep2" hidden>·</span>
        <span id="targetElements" hidden></span>
      </div>
    </header>

    <div class="body">
      <!-- 状態バナー: 対象が読めない / 結果が古い / 計測に失敗した の 1 本 -->
      <p class="banner" id="banner" role="status" aria-live="polite" hidden></p>

      <button id="measure" data-i18n="panelMeasure">Measure this page</button>

      <section class="result" id="result" hidden>
        <!-- ③ この計測が何をカバーしているか。**数字より上に置く** (設計 §4-1 ③) -->
        <section class="block" id="basisBlock" hidden>
          <h2 data-i18n="panelBasisTitle">What this measurement covers</h2>
          <ul class="notes" id="basisNotes"></ul>
        </section>

        <!-- ④ 一致 — ファミリ 4 行を 2 つの分母で。本設計の中核 -->
        <section class="block">
          <h2 data-i18n="panelMatchTitle">Matched against your tokens</h2>
          <table class="rates">
            <thead>
              <tr>
                <th></th>
                <th data-i18n="panelPerElement" title="">per element</th>
                <th data-i18n="panelPerValue" title="">per distinct value</th>
              </tr>
            </thead>
            <tbody id="familyRows"></tbody>
          </table>
          <p class="legend" id="matchLegend"></p>
        </section>

        <!-- ⑤ 総合率は意図的に小さく。ヒーロー数字にしない -->
        <p class="overall" id="overall"></p>

        <!-- ⑥ どこで崩れているか。率より主役にする -->
        <section class="block">
          <h2 data-i18n="panelOffendersTitle">Fix these first</h2>
          <ul class="offenders" id="offenders"></ul>
        </section>

        <!-- ⑦ 天井の表明。常時可視・折りたたまない -->
        <p class="ceiling" id="ceiling" data-i18n="panelCeiling">
          A match means the value equals one of your tokens. It does not mean the design is right.
        </p>
      </section>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
