name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall (wxt prepare) が型生成まで行う
      - name: Install
        run: pnpm install --frozen-lockfile

      # console.log の commit 禁止 (CLAUDE.md 規約) を機械化。untrusted input は使用しない
      - name: No console.log
        run: |
          if grep -rn "console\.log" src/ entrypoints/ --include='*.ts'; then
            echo "::error::console.log found (CLAUDE.md 規約違反)"; exit 1
          fi

      # ESLint: any 禁止 (Fiber allowlist) / @ts-ignore 禁止 / console.log 禁止 /
      # design 経路の Fiber import 禁止 (境界契約)。CLAUDE.md 規約を機械強制。
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # 提出前チェックを毎 push で実測する。掲載文の文字数・permissions・版数の一致・
      # **送信 API の発生箇所が 0 件** (Data usage「収集しない」の根拠) ・スクリーンショットの
      # 実寸 (PNG ヘッダ) まで見る。対外文書 4 点の申告がコードとずれたらここで落ちる。
      - name: Package
        run: pnpm zip
      - name: Submission check
        run: pnpm check:submission

  # e2e (playwright) は unit と別ジョブ。フレークが unit マージを止めない構造。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      # badge / framework-matrix (非React↑↓・MUI・Tailwind・Web Components) /
      # contextmenu (偽装への防御を含む) / coverage / popup を実 Chromium で検証
      - name: E2E
        run: pnpm e2e

      # 提出用スクリーンショットの生成ハーネスが壊れていないか (画像の比較はしない)。
      # **ピクセル比較は載せない**: フォント描画がマシン依存で、macOS で作った画像と
      # Ubuntu の描画は一致しない (偽の失敗になる)。ここで見るのは「撮れるか」だけ。
      # セレクタやフローが変わってスクショが撮れなくなる退行を止める。
      - name: Screenshot harness smoke
        run: pnpm shots
