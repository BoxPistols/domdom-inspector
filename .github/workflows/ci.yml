name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall (wxt prepare) が型生成まで行う
      - name: Install
        run: pnpm install --frozen-lockfile

      # console.log の commit 禁止 (CLAUDE.md 規約) を機械化。untrusted input は使用しない
      - name: No console.log
        run: |
          if grep -rn "console\.log" src/ entrypoints/ --include='*.ts'; then
            echo "::error::console.log found (CLAUDE.md 規約違反)"; exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # e2e (playwright) は unit と別ジョブ。フレークが unit マージを止めない構造。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      # badge / framework-matrix (非React↑↓・MUI・Tailwind) / popup を実 Chromium で検証
      - name: E2E
        run: pnpm e2e
