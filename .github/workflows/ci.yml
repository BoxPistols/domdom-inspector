name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall (wxt prepare) が型生成まで行う
      - name: Install
        run: pnpm install --frozen-lockfile

      # console.log の commit 禁止 (CLAUDE.md 規約) を機械化。untrusted input は使用しない
      - name: No console.log
        run: |
          if grep -rn "console\.log" src/ entrypoints/ --include='*.ts'; then
            echo "::error::console.log found (CLAUDE.md 規約違反)"; exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
